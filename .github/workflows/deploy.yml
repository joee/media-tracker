# Cloudflare Pages + Durable Objects Deployment
#
# Triggers on push to main branch.
# Deploys:
#   1. Frontend to Cloudflare Pages
#   2. Sync Worker to Cloudflare Workers (with Durable Objects)
#
# Required secrets:
#   - CLOUDFLARE_API_TOKEN: API token with Workers and Pages permissions
#   - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare account ID
#
# Optional environment variables:
#   - VITE_SYNC_URL: WebSocket URL for sync server (set in Pages project settings)

name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Deploy the sync worker first (frontend depends on its URL)
  deploy-worker:
    name: Deploy Sync Worker
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker Dependencies
        working-directory: worker
        run: npm ci || npm install

      - name: Deploy Worker
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --outdir dist
          echo "url=https://media-tracker-sync.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev" >> $GITHUB_OUTPUT

  # Deploy the frontend to Cloudflare Pages
  deploy-pages:
    name: Deploy Frontend to Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Frontend
        env:
          # Set the sync URL to point to the deployed worker
          # Can be overridden in Cloudflare Pages project settings
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL || format('wss://media-tracker-sync.{0}.workers.dev/sync', secrets.CLOUDFLARE_ACCOUNT_ID) }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=media-tracker

  # Summary job for deployment status
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-worker, deploy-pages]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy-worker.result }}" == "success" ]; then
            echo "- Sync Worker: Deployed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Sync Worker: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.deploy-pages.result }}" == "success" ]; then
            echo "- Frontend (Pages): Deployed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Frontend (Pages): Failed" >> $GITHUB_STEP_SUMMARY
          fi
